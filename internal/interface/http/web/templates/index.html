<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea Value - Dynamic Multi-Cron & Manual Sync Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-100/90 text-slate-800 antialiased h-screen overflow-hidden flex">

  <!-- Left Sidebar Navigation -->
  {{template "sidebar" .}}

  <!-- Main Full-Width Content Container -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    
    <!-- Topbar Header -->
    {{template "topbar" .}}

    <!-- Scrollable Dynamic Page Content Area (Full Screen Width) -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      
      <!-- Page 1: Dashboard & On-Demand Operations -->
      <div id="view-dashboard" class="page-view space-y-6">
        {{template "on_demand" .}}
      </div>

      <!-- Page 2: Device Registry & Per-Device Watermarks -->
      <div id="view-devices" class="page-view space-y-6 hidden">
        {{template "page_devices" .}}
      </div>

      <!-- Page 3: Automated Cron Schedules -->
      <div id="view-schedules" class="page-view space-y-6 hidden">
        {{template "schedules" .}}
      </div>

      <!-- Page 4: Activity Console & Logs -->
      <div id="view-logs" class="page-view space-y-6 hidden">
        {{template "console" .}}
      </div>

    </main>

  </div>

  <!-- Modal 1: Add/Edit Schedule Modal -->
  {{template "modal_schedule" .}}

  <!-- Modal 2: Time Range Picker Modal for Test Fetch & Manual Sync -->
  {{template "modal_timerange" .}}

  <!-- Modal 3: Raw API Response & Preview Modal -->
  {{template "modal_preview" .}}

  <!-- Modal 4: Adjust Sync Watermark Modal -->
  {{template "modal_watermark" .}}

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 hidden px-4 py-3 rounded-xl text-sm font-semibold shadow-xl transition-all duration-300 z-50 flex items-center gap-2.5"></div>

  <!-- Main Application Script -->
  <script src="/static/js/app.js"></script>
</body>
</html>
