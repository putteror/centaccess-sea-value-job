{{define "sidebar"}}
<aside id="appSidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 select-none z-30 transition-all duration-200">
  
  <!-- Top: Logo & Navigation -->
  <div class="p-4 space-y-6">
    
    <!-- Brand -->
    <div class="flex items-center gap-3 px-2 py-1.5">
      <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm tracking-wider shrink-0 shadow-sm">
        SV
      </div>
      <div class="min-w-0">
        <h1 class="text-sm font-bold text-white tracking-tight truncate">Sea Value</h1>
        <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>Integration Service</span>
        </div>
      </div>
    </div>

    <!-- Navigation Menu Items -->
    <div class="space-y-1">
      <div class="px-2 pb-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Menu</div>

      <!-- Nav Item 1: Dashboard -->
      <button type="button" onclick="switchPage('dashboard')" id="nav-dashboard" class="w-full px-3 py-2 rounded-lg font-medium text-xs text-white bg-blue-600 shadow-sm flex items-center justify-between transition-colors cursor-pointer">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 shrink-0 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>Dashboard & Sync</span>
        </div>
      </button>

      <!-- Nav Item 2: Device Registry -->
      <button type="button" onclick="switchPage('devices')" id="nav-devices" class="w-full px-3 py-2 rounded-lg font-medium text-xs text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
          </svg>
          <span>Device Registry</span>
        </div>
        <span id="navDevCountBadge" class="text-[10px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-mono">0 OT</span>
      </button>

      <!-- Nav Item 3: Cron Schedules -->
      <button type="button" onclick="switchPage('schedules')" id="nav-schedules" class="w-full px-3 py-2 rounded-lg font-medium text-xs text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Cron Schedules</span>
        </div>
        <span id="navSchCountBadge" class="text-[10px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-mono">0</span>
      </button>

      <!-- Nav Item 4: Activity Console -->
      <button type="button" onclick="switchPage('logs')" id="nav-logs" class="w-full px-3 py-2 rounded-lg font-medium text-xs text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span>Activity Console</span>
        </div>
      </button>
    </div>

  </div>

  <!-- Bottom: System Status & Clock -->
  <div class="p-4 border-t border-slate-800 space-y-3">
    
    <div class="p-3 rounded-lg bg-slate-950 border border-slate-800/80 text-[11px] space-y-1.5 text-slate-400">
      <div class="flex items-center justify-between">
        <span class="text-slate-400">Port</span>
        <code class="text-slate-300 font-mono font-medium">:{{.HTTPPort}}</code>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-slate-400">Timezone</span>
        <span class="text-slate-300">UTC+7 (Bangkok)</span>
      </div>
      <div class="pt-1 border-t border-slate-900 truncate">
        <span class="text-[10px] text-slate-400 block mb-0.5">CentAccess API</span>
        <span class="font-mono text-[10px] text-slate-300 truncate block" title="{{.AppAPIURL}}">{{.AppAPIURL}}</span>
      </div>
    </div>

    <!-- Live Digital Clock -->
    <div class="flex items-center justify-between px-1 text-xs text-slate-400 font-mono">
      <span>System Time</span>
      <span id="liveClock" class="font-semibold text-slate-300">--:--:--</span>
    </div>

  </div>

</aside>
{{end}}
