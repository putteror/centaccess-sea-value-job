{{define "topbar"}}
<header class="h-14 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between gap-4 shrink-0 select-none z-20">
  
  <!-- Left Side: Title & Status -->
  <div class="flex items-center gap-3 min-w-0">
    <button type="button" onclick="toggleSidebar()" class="md:hidden p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors cursor-pointer" aria-label="Toggle Sidebar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <div class="flex items-center gap-2.5 min-w-0">
      <span id="topbarPageTitle" class="text-sm font-bold text-slate-900 tracking-tight truncate">Dashboard</span>
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span>Online</span>
      </span>
    </div>
  </div>

  <!-- Right Side: Global Action Controls -->
  <div class="flex items-center gap-2 shrink-0">
    
    <!-- Test Auth Connection Button -->
    <button type="button" onclick="testConnection()" id="btn-test-conn" class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs border border-slate-300 shadow-xs transition-colors cursor-pointer flex items-center gap-1.5">
      <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
      <span>Test Auth</span>
    </button>

    <!-- Global Sync All Button -->
    <button type="button" onclick="openTimeRangeModal('sync', 'all')" id="btn-sync-all" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-xs flex items-center gap-1.5 transition-colors cursor-pointer">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
      <span>Sync All</span>
    </button>

  </div>

</header>
{{end}}
